<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dali, per te... 🧸</title>
  <!-- CDN per i coriandoli -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 50%, #ffb3c1 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px 25px;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(255, 182, 193, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      max-width: 380px;
      width: 100%;
      z-index: 1;
    }

    .hidden {
      display: none !important;
    }

    .header-tag {
      display: inline-block;
      background: rgba(255, 182, 193, 0.3);
      color: #c9184a;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .teddy-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .main-title {
      color: #800f2f;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #590d22;
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .divider {
      color: #ff85a1;
      font-size: 0.9rem;
      margin-bottom: 25px;
      letter-spacing: 4px;
    }

    button {
      background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
      color: white;
      border: none;
      padding: 16px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(201, 24, 74, 0.35);
      width: 100%;
    }

    button:active {
      transform: scale(0.97);
    }

    .photo-frame {
      width: 100%;
      height: 280px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
      border: 4px solid #ffffff;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .love-title {
      color: #800f2f;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .love-subtitle {
      color: #c9184a;
      font-size: 1.2rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Schermata 1 -->
  <div class="card" id="step-1">
    <div class="header-tag">Dali, per te... 🌸</div>
    <div class="teddy-icon">🧸</div>
    
    <h1 class="main-title">Come stai?</h1>
    <p class="subtitle">Ogni volta che senti la mia mancanza, puoi venire qui...</p>

    <div class="divider">✦ ✨ ✦</div>

    <button id="btn-reveal" onclick="mostraSorpresa()">
      Clicca qui per assaggiare il nostro amore ancora una volta ❤️
    </button>
  </div>

  <!-- Schermata 2 -->
  <div class="card hidden" id="step-2">
    <div class="photo-frame">
      <img src="foto.jpg" alt="Noi due">
    </div>

    <h2 class="love-title">Ci vorrà tempo, ma io ci credo...</h2>
    <p class="love-subtitle">Ti amo. ❤️</p>
  </div>

  <script>
    function mostraSorpresa() {
      // Nasconde la prima scheda e mostra la foto con il messaggio
      document.getElementById('step-1').style.display = 'none';
      var step2 = document.getElementById('step-2');
      step2.classList.remove('hidden');
      step2.style.display = 'block';

      // Lancia i coriandoli
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#ff4d6d', '#ff85a1', '#ffffff', '#ffccd5']
        });
      }
    }
  </script>
</body>
</html>
